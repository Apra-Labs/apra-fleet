<svg width="1080" height="680" viewBox="0 0 1080 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apra-fleet topology: heterogeneous devices connected to a central control plane.">
  <defs>
    <!-- Background Gradient Light -->
    <linearGradient id="topBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowLightCard" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#222222" flood-opacity="0.08"/>
    </filter>

    <!-- Cyber Grid Pattern Light -->
    <pattern id="gridTopLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1" opacity="0.8"/>
      <circle cx="40" cy="40" r="1.5" fill="#e0e0e0" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1080" height="680" fill="url(#topBgLight)"/>
  <rect width="1080" height="680" fill="url(#gridTopLight)"/>

  <!-- TOP HEADER BLOCK -->
  <!-- Category Pill Badge at TOP LEFT (x=50, y=32) -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#DFEAC1" stroke="#94BA33" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#465e0c"/>
    <text x="30" y="13" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5" fill="#5a7a10">FLEET TOPOLOGY</text>
  </g>

  <!-- Centered Headline Title at y=84 -->
  <text x="540" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="900" fill="#222222" text-anchor="middle">Heterogeneous Device &amp; Provider Control Plane</text>

  <!-- Centered Subtitle at y=112 -->
  <text x="540" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="500" fill="#555555" text-anchor="middle">A unified control plane orchestrating AI agents across your local laptops, cloud VMs, GPUs, and edge nodes.</text>

  <!-- TOPOLOGY CONSTELLATION GRAPH (Center at x=540, y=355) -->
  <g transform="translate(540, 355)">

    <!-- Orbit Ring & Spoke Lines to 6 Nodes -->
    <g fill="none" stroke-width="1.5">
      <circle cx="0" cy="0" r="220" stroke="#e0e0e0" stroke-dasharray="4 6"/>

      <!-- Spokes -->
      <path d="M 0 0 L -290 -145" stroke="#465e0c" stroke-dasharray="4 4"/>
      <path d="M 0 0 L 290 -145" stroke="#0284C7" stroke-dasharray="4 4"/>
      <path d="M 0 0 L 310 30" stroke="#465e0c" stroke-dasharray="4 4"/>
      <path d="M 0 0 L 200 180" stroke="#465e0c" stroke-dasharray="4 4"/>
      <path d="M 0 0 L -290 170" stroke="#7C3AED" stroke-dasharray="4 4"/>
      <path d="M 0 0 L -310 20" stroke="#555555" stroke-dasharray="4 4"/>
    </g>

    <!-- Security Protocol Badges along Spokes -->
    <g transform="translate(-145, -72)">
      <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#FFFFFF" stroke="#94BA33" stroke-width="1" filter="url(#shadowLightCard)"/>
      <text x="0" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#5a7a10" text-anchor="middle">SSE / TLS</text>
    </g>

    <g transform="translate(145, -72)">
      <rect x="-40" y="-11" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#0284C7" stroke-width="1" filter="url(#shadowLightCard)"/>
      <text x="0" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">SSH Tunnel</text>
    </g>

    <g transform="translate(-145, 85)">
      <rect x="-44" y="-11" width="88" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1" filter="url(#shadowLightCard)"/>
      <text x="0" y="0" dominant-baseline="central" font-family="monospace" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">{{secure.KEY}}</text>
    </g>

    <g transform="translate(155, 15)">
      <rect x="-28" y="-11" width="56" height="22" rx="11" fill="#FFFFFF" stroke="#465e0c" stroke-width="1" filter="url(#shadowLightCard)"/>
      <text x="0" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#5a7a10" text-anchor="middle">mTLS</text>
    </g>

    <!-- CENTER CONTROL PLANE HUB -->
    <text x="0" y="-62" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="#5a7a10" text-anchor="middle">CONTROL PLANE</text>

    <g>
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -46,-24" fill="#FFFFFF" stroke="#94BA33" stroke-width="3" filter="url(#shadowLightCard)"/>
      <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#DFEAC1" stroke="#465e0c" stroke-width="1.2" stroke-dasharray="4 2"/>
    </g>

    <circle cx="0" cy="0" r="15" fill="#465e0c"/>
    <polygon points="-5,-6 6,0 -5,6" fill="#FFFFFF"/>
    <text x="0" y="62" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555" text-anchor="middle">Supervisor • Ledger • MCP</text>


    <!-- SLEEK COMPACT MEMBER CARDS -->

    <!-- NODE 1: MacBook Pro (Top-Left: -290, -145) -->
    <g transform="translate(-290, -145)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadowLightCard)"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#f8f8f8"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#f8f8f8"/>
      <line x1="-85" y1="-16" x2="85" y2="-16" stroke="#f0f0f0" stroke-width="1"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#94BA33"/>
      <circle cx="-55" cy="-28" r="3" fill="#94BA33"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#222222">MacBook Pro (macOS)</text>

      <rect x="-75" y="-10" width="60" height="18" rx="4" fill="#DFEAC1" stroke="#94BA33" stroke-width="1"/>
      <text x="-45" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#5a7a10" text-anchor="middle">Claude</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555">Role: Lead Developer</text>
    </g>

    <!-- NODE 2: Cloud VM (Top-Right: 290, -145) -->
    <g transform="translate(290, -145)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadowLightCard)"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#f8f8f8"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#f8f8f8"/>
      <line x1="-85" y1="-16" x2="85" y2="-16" stroke="#f0f0f0" stroke-width="1"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#94BA33"/>
      <circle cx="-55" cy="-28" r="3" fill="#94BA33"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#222222">Cloud VM (AWS EC2)</text>

      <rect x="-75" y="-10" width="92" height="18" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
      <text x="-29" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#0369A1" text-anchor="middle">Gemini / Codex</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555">Role: Parallel Refactor</text>
    </g>

    <!-- NODE 3: GPU Supercomputer (Middle-Right: 310, 30) -->
    <g transform="translate(310, 30)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadowLightCard)"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#f8f8f8"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#f8f8f8"/>
      <line x1="-85" y1="-16" x2="85" y2="-16" stroke="#f0f0f0" stroke-width="1"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#94BA33"/>
      <circle cx="-55" cy="-28" r="3" fill="#94BA33"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#222222">Linux GPU (Lab Box)</text>

      <rect x="-75" y="-10" width="112" height="18" rx="4" fill="#DFEAC1" stroke="#465e0c" stroke-width="1"/>
      <text x="-19" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#5a7a10" text-anchor="middle">Local vLLM / Llama3</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555">Role: Private Data Ops</text>
    </g>

    <!-- NODE 4: CI Test Rack (Bottom-Right: 200, 180) -->
    <g transform="translate(200, 180)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="1.2" filter="url(#shadowLightCard)"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#f8f8f8"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#f8f8f8"/>
      <line x1="-85" y1="-16" x2="85" y2="-16" stroke="#f0f0f0" stroke-width="1"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#94BA33"/>
      <circle cx="-55" cy="-28" r="3" fill="#94BA33"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#222222">CI Test Rack (Linux)</text>

      <rect x="-75" y="-10" width="118" height="18" rx="4" fill="#DFEAC1" stroke="#94BA33" stroke-width="1"/>
      <text x="-16" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#5a7a10" text-anchor="middle">81 Test Integration Suites</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555">Role: Quality Verification</text>
    </g>

    <!-- NODE 5: Windows Workstation (Bottom-Left: -290, 170) -->
    <g transform="translate(-290, 170)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadowLightCard)"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#f8f8f8"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#f8f8f8"/>
      <line x1="-85" y1="-16" x2="85" y2="-16" stroke="#f0f0f0" stroke-width="1"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#94BA33"/>
      <circle cx="-55" cy="-28" r="3" fill="#94BA33"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#222222">Windows Workstation (Win 11)</text>

      <rect x="-75" y="-10" width="72" height="18" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
      <text x="-39" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#6D28D9" text-anchor="middle">Antigravity</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555">Role: Cross Reviewer</text>
    </g>

    <!-- NODE 6: Jetson / Raspi (Middle-Left: -310, 20) -->
    <g transform="translate(-310, 20)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadowLightCard)"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#f8f8f8"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#f8f8f8"/>
      <line x1="-85" y1="-16" x2="85" y2="-16" stroke="#f0f0f0" stroke-width="1"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#94BA33"/>
      <circle cx="-55" cy="-28" r="3" fill="#94BA33"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#222222">Jetson / Raspi (ARM64)</text>

      <rect x="-75" y="-10" width="52" height="18" rx="4" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1"/>
      <text x="-49" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#555555" text-anchor="middle">NoLLM</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#555555">Role: Edge Worker</text>
    </g>

  </g>

  <!-- BOTTOM FOOTER TAGLINE -->
  <text x="540" y="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.5" fill="#555555" text-anchor="middle">ONE CONTROL PLANE. ANY DEVICE. ANY MODEL. ANY WORKFLOW. ANY DOMAIN.</text>
</svg>
