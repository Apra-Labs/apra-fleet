name: Regression - install/upgrade proof

# Fresh-install harness (tests/integration/fresh-install) on disposable hosted
# VMs: builds this commit's installers, then runs passes A (no Node), B
# (Node), U (upgrade from the latest release via install --force) and U2
# (upgrade along the 'apra-fleet update' path) through the host driver, one
# fresh VM per OS x pass. A stale upgrade-baseline pin is INCONCLUSIVE (red).
#
# member-host-upgrade (windows-2022, tests/integration/member-host): a
# localhost OpenSSH server with Git Bash as its default shell is the member.
# Passes: Q (quote-led commands reach the member with the exact argv), RF
# (update_member replace-full from the latest release), RB (forced rollback),
# RFS (replace-full refuses while a sprint runs and changes nothing, then stops
# the idle supervisor itself) and RBS (the rollback's reinstall refuses with
# E-FLEET-SE-RUNNING under a supervisor, then succeeds once it is stopped).
#
# Runner-minute caps: every job that can land on a macOS runner has an explicit
# timeout-minutes, because macOS runners starved on the nightlies of 11-18,
# 11-19 and 11-23 and an uncapped job holds the whole run open (the default
# cap is 360 minutes). Sizes are generous multiples of a normal run, not tuned
# to a measured median: build-installer 45 (npm ci + SEA build + package; the
# slowest OS is Windows), fresh-install 60, undici-pack-install 30. fail-fast
# stays false everywhere, so a capped or starved macOS job never cancels the
# Linux and Windows jobs.
#
# Member-host decoupling: member-host-upgrade only needs the WINDOWS installer,
# so it runs under `if: always() && !cancelled()` and downloads just that one
# artifact -- a failed or starved macOS (or Linux) build leg no longer skips it.
# If the Windows build leg produced no artifact it fails with a clear message.
#
# macOS retry: a job that never got a runner is not covered by timeout-minutes
# (the cap only starts counting once a runner picks the job up), and a cap that
# fires just fails the job. So a separate workflow, regression-macos-retry.yml,
# listens for this workflow completing and, ONCE (run_attempt 1), reruns the
# failed jobs when every failed or cancelled job ran on macOS. Limitation, stated
# honestly: a starved job still sits in the queue for as long as GitHub leaves
# it there (up to the 24 hour queue limit) before the run completes and the
# retry can fire; the retry shortens the recovery, not the wait.
#
# Nightly only (schedule runs on the default branch) plus manual dispatch for
# a specific branch: `gh workflow run regression.yml --ref <branch>`. It used
# to run on every non-main push (~15 jobs incl. Windows/macOS each), which
# multiplied runner minutes across every sprint and agent branch. CI
# (ci.yml) is the per-PR verdict.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

# Fork-safe: read-only token, no secrets anywhere in this workflow.
permissions:
  contents: read

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: apra-fleet-installer-linux-x64
          - os: macos-latest
            binary: apra-fleet-installer-darwin-arm64
          # windows-2022 (VS 17), not windows-latest (VS 18): node-gyp can't
          # detect VS 18. Same pin as ci.yml build-binary.
          - os: windows-2022
            binary: apra-fleet-installer-win-x64.exe
    runs-on: ${{ matrix.os }}
    # Explicit cap: a starved macOS runner must not hold the nightly open.
    timeout-minutes: 45
    # Build steps mirror ci.yml build-binary (same actions and versions).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_ENV "npm_config_msvs_version=2022"
        shell: pwsh

      - name: Install dependencies
        run: npm ci

      - name: Install rcedit (Windows only)
        if: runner.os == 'Windows'
        run: npm install -g rcedit

      - name: Build SEA bundle
        run: node scripts/build-sea.mjs

      - name: Generate SEA config
        run: node scripts/gen-sea-config.mjs

      - name: Strip node.exe signature before SEA injection (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          Write-Host "Node path: $nodePath"
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          Write-Host "signtool: $st"
          & $st remove /s $nodePath

      - name: Package SEA binary
        run: node scripts/package-sea.mjs

      - name: Smoke test - version
        run: ./dist/${{ matrix.binary }} --version
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          retention-days: 7

  fresh-install:
    name: fresh-install (${{ matrix.os }}, pass ${{ matrix.pass }})
    needs: build-installer
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        pass: [A, B, U, U2]
        include:
          - os: ubuntu-latest
            binary: apra-fleet-installer-linux-x64
          - os: macos-latest
            binary: apra-fleet-installer-darwin-arm64
          - os: windows-2022
            binary: apra-fleet-installer-win-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      # Runs the harness itself; the host driver drops this Node (and every
      # other PATH dir holding node/npm) from the box's environment.
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: regression-${{ matrix.binary }}
          path: candidate

      - name: Make installer executable
        if: runner.os != 'Windows'
        run: chmod +x "candidate/${{ matrix.binary }}"

      # A real desktop Linux user has a systemd --user manager from their login
      # session; the runner account has none. Lingering starts one, so the
      # installer's service path is exercised instead of skipped.
      - name: Start a systemd user manager for the runner account (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          RT="/run/user/$(id -u)"
          for i in $(seq 1 30); do [ -S "$RT/bus" ] && break; sleep 1; done
          ls -la "$RT" || true
          echo "XDG_RUNTIME_DIR=$RT" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$RT/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RT" systemctl --user show-environment | head -5

      # Hosted Windows images preinstall Node.js system-wide. Remove it so the
      # VM is Node-free like a fresh user machine, and the pinned Node MSI the
      # passes install is not blocked by a newer preinstalled one.
      - name: Remove the preinstalled system Node.js (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $apps = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Node.js*' }
          foreach ($a in $apps) {
            Write-Host "uninstalling $($a.DisplayName) $($a.DisplayVersion) $($a.PSChildName)"
            $p = Start-Process msiexec.exe -ArgumentList '/x', $a.PSChildName, '/qn', '/norestart' -Wait -PassThru
            Write-Host "msiexec /x exit $($p.ExitCode)"
          }
          $dir = Join-Path $env:ProgramFiles 'nodejs'
          if (Test-Path $dir) { Write-Host "removing leftover $dir"; Remove-Item -Recurse -Force $dir }
          $mp = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) -and $_.TrimEnd('\') -ne $dir }
          [Environment]::SetEnvironmentVariable('Path', ($mp -join ';'), 'Machine')
          Write-Host "Machine PATH now: $($mp -join ';')"

      - name: Run pass ${{ matrix.pass }} through the host driver
        shell: bash
        run: >-
          node tests/integration/fresh-install/run.mjs
          --driver host --i-am-disposable
          --binary "candidate/${{ matrix.binary }}"
          --passes ${{ matrix.pass }}
          --out "${{ runner.temp }}/fi-out"
          --cache "${{ runner.temp }}/fi-cache"

      - name: Report summary
        if: always()
        shell: bash
        run: |
          f="${{ runner.temp }}/fi-out/report.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no report.md produced" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-install-${{ matrix.os }}-${{ matrix.pass }}
          path: ${{ runner.temp }}/fi-out
          retention-days: 14
          if-no-files-found: warn

  # Member-host upgrade coverage: replace-full and rollback from the latest
  # release on a member reached over SSH (Windows OpenSSH + Git Bash), with and
  # without a fleet-sprint supervisor running. Disposable windows-2022 VM only:
  # the setup script refuses without CI=true and -IAmDisposable.
  member-host-upgrade:
    name: member-host-upgrade (windows-2022)
    needs: build-installer
    # Independent of the macOS/Linux build legs: runs whenever the Windows leg
    # produced its artifact (checked in the download step below).
    if: always() && !cancelled()
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Configure Windows build tools
        run: Add-Content $env:GITHUB_ENV "npm_config_msvs_version=2022"
        shell: pwsh

      # The driver talks to the candidate orchestrator over MCP stdio using the
      # repo's own SDK dependency.
      - name: Install dependencies
        run: npm ci

      - name: Download the Windows installer
        id: download-installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: regression-apra-fleet-installer-win-x64.exe
          path: candidate

      - name: Require the Windows installer artifact
        shell: bash
        run: |
          if [ ! -f "candidate/apra-fleet-installer-win-x64.exe" ]; then
            echo "::error::member-host-upgrade needs the artifact regression-apra-fleet-installer-win-x64.exe from the build-installer windows-2022 leg, and it is missing (that leg failed or was skipped); nothing was tested."
            exit 1
          fi

      - name: Set up the OpenSSH + Git Bash member host
        shell: pwsh
        run: >-
          ./tests/integration/member-host/setup-openssh-gitbash.ps1
          -IAmDisposable
          -KeyDir "${{ runner.temp }}/member-host-ssh"
          -InfoFile "${{ runner.temp }}/member-host-info.json"

      - name: Run the member-host passes (Q, RF, RB, RFS, RBS)
        shell: bash
        run: >-
          node tests/integration/member-host/run.mjs
          --binary "candidate/apra-fleet-installer-win-x64.exe"
          --setup-info "${{ runner.temp }}/member-host-info.json"
          --i-am-disposable
          --passes Q,RF,RB,RFS,RBS
          --out "${{ runner.temp }}/mh-out"

      - name: Report summary
        if: always()
        shell: bash
        run: |
          f="${{ runner.temp }}/mh-out/report.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no report.md produced" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: member-host-upgrade-report
          path: ${{ runner.temp }}/mh-out
          retention-days: 14
          if-no-files-found: warn

  # Slow proof of the corrupt-index detector against a real gitnexus index
  # (vitest.config.ts keeps it out of the default run). Windows: where the
  # corruption was reproduced.
  code-index-real-gitnexus:
    name: code-index-real-gitnexus
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Configure Windows build tools
        run: Add-Content $env:GITHUB_ENV "npm_config_msvs_version=2022"
        shell: pwsh

      - name: Install dependencies
        run: npm ci

      - name: Run the real gitnexus index test
        env:
          APRA_RUN_REAL_GITNEXUS: '1'
          APRA_TEST_TIMEOUT_MS: '1800000'
          APRA_TEST_SUITES_JSON: '[{"name":"vitest","cmd":"npm.cmd","args":["exec","--","vitest","run","tests/code-index-corrupt-real-gitnexus.test.ts"]}]'
        run: node scripts/run-all-tests.mjs

  # npm pack + npm install of this commit into a scratch consumer project,
  # proving the undici 7.x pin propagates to an installed copy. Too slow for
  # the per-PR vitest run (2-3 min on Windows), so vitest.config.ts excludes
  # it unless APRA_RUN_PACK_INSTALL=1; this job is where it runs.
  undici-pack-install:
    name: undici-pack-install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_ENV "npm_config_msvs_version=2022"
        shell: pwsh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run undici pack/install test
        timeout-minutes: 20
        env:
          APRA_RUN_PACK_INSTALL: '1'
        # dist-pm builds dist/workflows, which the stripped-pack proof packs.
        run: |
          npm run dist-pm
          npx vitest run tests/undici-pack-install.test.ts tests/integration/stripped-pack-install.test.ts
