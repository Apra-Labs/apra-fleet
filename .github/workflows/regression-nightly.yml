name: Regression - nightly real-bd suite

# Tier B of the regression revamp (apra-fleet-7f39): the unmocked apra-fleet-se
# suite against the real bd CLI, plus the slow lane (real-time watchdog
# tests). Moved here from the in-sprint regression playbook, where it took
# ~18% of sprint wall-clock. Runs nightly, on bd pin changes, and on demand.
# Scheduled runs fire only from the default branch.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    # Files that pin the bd version (the installer is the source of truth,
    # read below), plus this workflow itself.
    paths:
      - 'src/cli/install.ts'
      - '.github/workflows/ci.yml'
      - 'tests/integration/fresh-install/checklist.json'
      - '.github/workflows/regression-nightly.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-bd-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Same pin the installer ships (src/cli/install.ts); fail loud if it
      # cannot be found rather than silently testing some other bd.
      # CI='' defeats @beads/bd's postinstall guard that skips the download in CI.
      - name: Install pinned bd CLI
        env:
          CI: ''
        run: |
          BD_PIN="$(grep -oE "@beads/bd@[0-9]+\.[0-9]+\.[0-9]+" src/cli/install.ts | head -n1)"
          if [ -z "$BD_PIN" ]; then
            echo "::error::could not find the @beads/bd@X.Y.Z pin in src/cli/install.ts"
            exit 1
          fi
          echo "Installing $BD_PIN"
          npm install -g "$BD_PIN" --foreground-scripts
          bd --version

      - name: Configure git identity (bd init commits)
        run: |
          git config --global user.name "regression-nightly"
          git config --global user.email "regression-nightly@apra-fleet.invalid"

      # Imports git-tracked .beads/issues.jsonl so dashboard/backlog tests
      # have a queryable DB (the Dolt DB is gitignored). Same as ci.yml,
      # including the retry for a concurrent `bd dolt push` moving the ref.
      - name: Bootstrap this repo's own beads DB
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bd bootstrap --yes; then exit 0; fi
            echo "::warning::bd bootstrap failed (attempt $attempt/3)"
            rm -rf .beads/embeddeddolt
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::error::bd bootstrap failed after 3 attempts"
          exit 1

      # --status exit codes: 0 pass, 1 failures, 3 still running, 2 infra
      # fail-loud. Start and poll in one step so the detached run is ours.
      # Test failures do not fail this step: its --status exit code goes to
      # an output and the quarantine gate below decides. Any other exit code
      # (2 = crashed/pending/stale) still fails the step here.
      - name: Run apra-fleet-se suite against real bd
        id: integ
        run: |
          node scripts/run-integ-suites.mjs --start || echo "integ-suites --start exit=$?"
          while :; do
            rc=0
            node scripts/run-integ-suites.mjs --status --wait=45 || rc=$?
            if [ "$rc" -ne 3 ]; then break; fi
          done
          echo "integ-suites --status exit=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      # Same command as the package's test:slow script (same replay-mode env),
      # plus the checkpoint reporter writing slow-suite-status.json so the gate
      # can apply the quarantine (slow/ fingerprints). node --test exits 1 on
      # test failures; the gate checks every slow file has a result.
      - name: Run slow lane
        id: slow
        if: ${{ !cancelled() }}
        working-directory: packages/apra-fleet-se
        env:
          INTEG_SUITES_STATUS_FILE: ${{ github.workspace }}/slow-suite-status.json
          INTEG_SUITES_HEARTBEAT_FILE: ${{ runner.temp }}/slow-suite-heartbeat.json
        run: |
          rm -f "$INTEG_SUITES_STATUS_FILE"
          rc=0
          node --test \
            --test-reporter=./test/helpers/timestamped-reporter.mjs --test-reporter-destination=stdout \
            --test-reporter="$GITHUB_WORKSPACE/scripts/integ-file-results-reporter.mjs" --test-reporter-destination=stdout \
            "$PWD"/test/slow/*.test.mjs || rc=$?
          echo "slow lane exit=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # The only step that fails the job on test results: new failures or
      # expired quarantine entries (tests/regression/quarantine.json). A
      # missing/incomplete status file exits 2 -- never green-by-absence.
      # Over-budget files are reported in the summary but do not gate.
      - name: Quarantine gate (new failures only)
        if: ${{ !cancelled() }}
        env:
          INTEG_RC: ${{ steps.integ.outputs.rc }}
          SLOW_RC: ${{ steps.slow.outputs.rc }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ "$INTEG_RC" != "0" ] && [ "$INTEG_RC" != "1" ]; then
            echo "::error::real-bd suite did not complete (--status exit='$INTEG_RC')"
            exit 2
          fi
          if [ -z "$SLOW_RC" ]; then
            echo "::error::slow lane did not run"
            exit 2
          fi
          if [ ! -f integ-suite-status.json ]; then
            echo "::error::no integ-suite-status.json -- the real-bd suite recorded nothing"
            exit 2
          fi
          HEAD_SHA="$(node -p "require('./integ-suite-status.json').headSha")"
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::integ-suite-status.json headSha=$HEAD_SHA, expected $EXPECTED_SHA"
            exit 2
          fi
          node scripts/check-integ-suite-budget.mjs integ-suite-status.json \
            --quarantine --budget-advisory \
            --slow=slow-suite-status.json \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Upload integ-suite status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integ-suite-status
          path: |
            integ-suite-status.json
            integ-suite-run.log
            slow-suite-status.json
          if-no-files-found: warn
          retention-days: 30
