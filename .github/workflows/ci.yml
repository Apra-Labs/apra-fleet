name: CI - Build & Test

on:
  workflow_dispatch:
  push:
    # feat/kb-redesign pushes also publish an unsigned prerelease (job
    # prerelease below) so member installs of its builds have an anonymous
    # download source.
    branches: [main, feat/kb-redesign]
    tags: ['v*']
    paths-ignore:
      - '.github/e2e/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/e2e/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-latest
          # Pinned to windows-2022 (VS 17): node-gyp 11.5.0 can't detect
          # VS 18 on windows-latest, breaking native module builds.
          - os: windows-latest
            runner: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_ENV "npm_config_msvs_version=2022"
        shell: pwsh

      # node_modules cache (exact-key only, no restore-keys). Key covers OS,
      # arch, runner image, the installed node -v (native addon ABI) and every
      # manifest, so a hit is only taken when npm ci would produce the same
      # tree. Bump nm-v1 to bust. Saved right after npm ci so the entry holds
      # the pristine install, not post-build/test state.
      # Install-time scripts audit: root `prepare` only copies git hooks into
      # .git/hooks (not needed in CI); ssh2/cpu-features/esbuild/fsevents
      # install scripts write only inside node_modules, so a hit carries their
      # output. No workspace has install scripts. apra-pm is not a workspace
      # and is never installed here, so its lockfile is not part of the key.
      - name: Compute node_modules cache key
        id: nm-key
        shell: bash
        run: echo "key=nm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${ImageOS}-node$(node -v)-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.nm-key.outputs.key }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules cache
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.nm-key.outputs.key }}

      # A cache that dereferenced a workspace link would restore a stale copy
      # of packages/* instead of a link to the live source. Fail loudly.
      - name: Verify workspace links resolve to packages/
        shell: bash
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            let bad = 0;
            for (const [p, v] of Object.entries(lock.packages)) {
              if (!v.link) continue;
              const want = fs.realpathSync(path.resolve(v.resolved));
              let got = '<missing>';
              try { got = fs.realpathSync(p); } catch {}
              const ok = got === want && fs.lstatSync(p).isSymbolicLink();
              console.log((ok ? '[OK] ' : '[FAIL] ') + p + ' -> ' + got);
              if (!ok) bad++;
            }
            if (bad) { console.error('::error::' + bad + ' workspace link(s) in node_modules are not links to packages/'); process.exit(1); }
          "

      - name: Build
        run: npm run build

      - name: Verify build output
        run: node -e "require('fs').existsSync('dist/index.js') || (console.error('Build output dist/index.js not found'), process.exit(1))"

      # bd CLI, needed on PATH before "Run tests" (apra-fleet-se + exec-bd
      # tests shell out to it). CI='' defeats @beads/bd's postinstall guard
      # that otherwise skips the download in CI.
      # Pinned to 1.3.0: the bd version the test suites are verified against.
      # Known regression: 1.3.0 still misreads a fresh dir's failed
      # `git ls-remote` (apra-fleet-4ipl, upstream not fixed yet).
      # Retried: the package's postinstall downloads the bd binary from GitHub
      # releases, which intermittently answers HTTP 500.
      - name: Install bd CLI (required by apra-fleet-se tests and tests/exec-bd.test.ts)
        shell: bash
        env:
          CI: ''
        run: |
          for attempt in 1 2 3; do
            if npm install -g @beads/bd@1.3.0 --foreground-scripts; then break; fi
            if [ "$attempt" = 3 ]; then echo "bd install failed after 3 attempts"; exit 1; fi
            echo "bd install attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          bd --version

      # scripts/run-all-tests.mjs is the single source of truth: runs vitest,
      # every workspace suite, and apra-pm, each exactly once.
      - name: Run tests
        run: npm test

      # Real-bd coverage for f34's topology subtests, which no-op under the
      # default replay mode "Run tests" uses. Scoped to this file, not the
      # full real-bd suite (~4h, once-per-sprint per apra-fleet-040).
      # Ubuntu-only: avoids tripling this ~6min run across the OS matrix.
      - name: Run real-bd concurrent sprint launch topology tests (apra-fleet-se, ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/apra-fleet-se
        run: node scripts/run-tests.mjs real test/f34-concurrent-launch-engagement-integration.test.mjs

      # Catches a dev bypassing the pre-commit hook that regenerates
      # llms-full.txt when docs change. OS-agnostic generator -> ubuntu-only.
      - name: Verify llms-full.txt is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/gen-llms-full.mjs
          if ! git diff --exit-code llms-full.txt; then
            echo ""
            echo "::error::llms-full.txt is stale."
            echo "Either re-run 'npm install' to install the pre-commit hook, or"
            echo "run 'node scripts/gen-llms-full.mjs' and commit the result."
            exit 1
          fi

      # Runs the real contract:generate write path (not --check) and diffs
      # against committed output, catching drift a --check-mode bug might
      # miss. OS-agnostic generator -> ubuntu-only, same as llms-full.txt above.
      - name: Verify memory-contract generated files are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run contract:generate
          if ! git diff --exit-code -- memory-contract/v1/schemas memory-contract/v1/bindings; then
            echo ""
            echo "::error::memory-contract/v1/schemas or memory-contract/v1/bindings is stale."
            echo "Run 'npm run build && npm run contract:generate' and commit the result."
            exit 1
          fi

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FULL_VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf-8')).version)")
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-6)
            FULL_VERSION="v${VERSION}_${SHORT_SHA}"
          fi
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $FULL_VERSION"

      - name: Create tarball
        run: |
          TARBALL_NAME="apra-fleet-${{ steps.version.outputs.version }}.tar.gz"
          tar czf "$TARBALL_NAME" \
            dist/ \
            skills/ \
            hooks/ \
            install.sh \
            version.json \
            package.json \
            package-lock.json
          echo "TARBALL_NAME=$TARBALL_NAME" >> "$GITHUB_ENV"
          echo "Created: $TARBALL_NAME"
          tar tzf "$TARBALL_NAME" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apra-fleet-tarball
          path: ${{ env.TARBALL_NAME }}
          retention-days: 30

  build-binary:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: apra-fleet-installer-linux-x64
          - os: macos-latest
            binary: apra-fleet-installer-darwin-arm64
          # Intel macOS: macos-15-intel is GitHub's Intel runner label (macos-13
          # is retired). The runner's own setup-node installs an x64 node, which
          # carries the SEA fuse package-sea.mjs injects into. Without this asset
          # an Intel Mac member can never be upgraded from a non-Mac orchestrator.
          - os: macos-15-intel
            binary: apra-fleet-installer-darwin-x64
          # windows-2022 (VS 17), not windows-latest (VS 18): node-gyp can't
          # detect VS 18. See the build-and-test matrix above.
          - os: windows-2022
            binary: apra-fleet-installer-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_ENV "npm_config_msvs_version=2022"
        shell: pwsh

      # node_modules cache (exact-key only, no restore-keys). Key covers OS,
      # arch, runner image, the installed node -v (native addon ABI) and every
      # manifest, so a hit is only taken when npm ci would produce the same
      # tree. Bump nm-v1 to bust. Saved right after npm ci so the entry holds
      # the pristine install, not post-build/test state.
      - name: Compute node_modules cache key
        id: nm-key
        shell: bash
        run: echo "key=nm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${ImageOS}-node$(node -v)-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.nm-key.outputs.key }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules cache
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.nm-key.outputs.key }}

      # A cache that dereferenced a workspace link would restore a stale copy
      # of packages/* instead of a link to the live source. Fail loudly.
      - name: Verify workspace links resolve to packages/
        shell: bash
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            let bad = 0;
            for (const [p, v] of Object.entries(lock.packages)) {
              if (!v.link) continue;
              const want = fs.realpathSync(path.resolve(v.resolved));
              let got = '<missing>';
              try { got = fs.realpathSync(p); } catch {}
              const ok = got === want && fs.lstatSync(p).isSymbolicLink();
              console.log((ok ? '[OK] ' : '[FAIL] ') + p + ' -> ' + got);
              if (!ok) bad++;
            }
            if (bad) { console.error('::error::' + bad + ' workspace link(s) in node_modules are not links to packages/'); process.exit(1); }
          "

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '_')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf-8'));v.version='${TAG}';fs.writeFileSync('version.json',JSON.stringify(v,null,2))"
          echo "Injected version: ${TAG}"

      - name: Install rcedit (Windows only)
        if: runner.os == 'Windows'
        run: npm install -g rcedit

      - name: Build SEA bundle
        run: node scripts/build-sea.mjs

      - name: Generate SEA config
        run: node scripts/gen-sea-config.mjs

      - name: Strip node.exe signature before SEA injection (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          Write-Host "Node path: $nodePath"
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          Write-Host "signtool: $st"
          & $st remove /s $nodePath

      - name: Package SEA binary
        run: node scripts/package-sea.mjs

      - name: Smoke test - version
        run: ./dist/${{ matrix.binary }} --version
        shell: bash

      - name: Smoke test - help
        run: ./dist/${{ matrix.binary }} --help
        shell: bash

      # Proves "no system Node required": Node stripped from PATH, isolated
      # HOME, so only the binary's embedded runtime can work (apra-fleet-7pm.13).
      - name: Smoke test - workflow hello-world (no system Node)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(pwd)/dist/${{ matrix.binary }}"
          FAKEHOME="$(mktemp -d)"
          export HOME="$FAKEHOME"
          export APRA_FLEET_DATA_DIR="$FAKEHOME/data"
          export PATH="/usr/bin:/bin"
          ! command -v node
          OUT="$("$BIN" workflow hello-world one two)"
          echo "$OUT"
          echo "$OUT" | grep -qF '[OK] hello-world: args=one,two engine=resolved'
          test -f "$FAKEHOME/.apra-fleet/workflows/fleet-sprint/fleet-sprint/runner.js"
          test -f "$FAKEHOME/.apra-fleet/schemas/reviewer-output.json"
          # Hand off via GITHUB_ENV so the next step reuses this self-healed HOME.
          echo "FAKEHOME=$FAKEHOME" >> "$GITHUB_ENV"

      - name: Smoke test - workflow hello-world (no system Node) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FAKEHOME = Join-Path $env:RUNNER_TEMP "fakehome-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $FAKEHOME -Force | Out-Null
          $env:HOME = $FAKEHOME
          $env:USERPROFILE = $FAKEHOME
          $env:APRA_FLEET_DATA_DIR = Join-Path $FAKEHOME "data"

          $filtered = ($env:PATH -split ';') | Where-Object { $_ -notmatch 'hostedtoolcache.*node' -and $_ -notmatch '[\\/]nodejs' }
          $env:PATH = ($filtered -join ';')
          if (Get-Command node -ErrorAction SilentlyContinue) {
            Write-Error "node is still resolvable on PATH after stripping"
            exit 1
          }

          $bin = Join-Path $PWD "dist\${{ matrix.binary }}"
          $out = & $bin workflow hello-world one two
          $out | Write-Host
          if (-not ($out -join [char]10).Contains('[OK] hello-world: args=one,two engine=resolved')) {
            Write-Error "unexpected stdout from workflow hello-world"
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "workflow hello-world exited $LASTEXITCODE"
            exit 1
          }

          $runnerPath = Join-Path $FAKEHOME ".apra-fleet\workflows\fleet-sprint\fleet-sprint\runner.js"
          $schemaPath = Join-Path $FAKEHOME ".apra-fleet\schemas\reviewer-output.json"
          if (-not (Test-Path $runnerPath)) {
            Write-Error "missing $runnerPath"
            exit 1
          }
          if (-not (Test-Path $schemaPath)) {
            Write-Error "missing $schemaPath"
            exit 1
          }

          # Hand off via GITHUB_ENV so the next step reuses this self-healed HOME.
          Add-Content -Path $env:GITHUB_ENV -Value "FAKEHOME=$FAKEHOME"

      # `workflow --list` never self-heals, so this must reuse the FAKEHOME
      # the hello-world step above already self-healed.
      - name: Smoke test - workflow arg/error surface
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          export HOME="$FAKEHOME"
          export APRA_FLEET_DATA_DIR="$FAKEHOME/data"
          OUT=$(./dist/${{ matrix.binary }} workflow does-not-exist 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" -eq 1 ]
          echo "$OUT" | grep -qi 'workflow "does-not-exist" not found in'
          echo "$OUT" | grep -q 'workflows'

          LIST_OUT=$(./dist/${{ matrix.binary }} workflow --list)
          echo "$LIST_OUT"
          echo "$LIST_OUT" | grep -q 'fleet-sprint'
          echo "$LIST_OUT" | grep -q 'hello-world'

      - name: Smoke test - workflow arg/error surface (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HOME = $env:FAKEHOME
          $env:USERPROFILE = $env:FAKEHOME
          $env:APRA_FLEET_DATA_DIR = Join-Path $env:FAKEHOME "data"

          $bin = Join-Path $PWD "dist\${{ matrix.binary }}"
          $out = & $bin workflow does-not-exist 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 1) {
            Write-Error "expected exit code 1 from workflow does-not-exist, got $code"
            exit 1
          }
          $outText = ($out -join [char]10)
          if ($outText -notmatch '(?i)workflow "does-not-exist" not found in') {
            Write-Error "missing not-found message in output"
            exit 1
          }
          if ($outText -notmatch 'workflows') {
            Write-Error "missing 'workflows' text in output"
            exit 1
          }

          $listOut = & $bin workflow --list
          $listOut | Write-Host
          $listText = ($listOut -join [char]10)
          if ($listText -notmatch 'fleet-sprint') {
            Write-Error "workflow --list output missing fleet-sprint"
            exit 1
          }
          if ($listText -notmatch 'hello-world') {
            Write-Error "workflow --list output missing hello-world"
            exit 1
          }

      # Unlike hello-world above, --help here statically imports the full
      # runtime (workflow engine, apra-fleet-client, ajv, vendored role
      # schemas), so a clean exit + usage text with no dev-fallback warning
      # proves module resolution and schema loading both work from the
      # packaged binary (apra-fleet-7pm.15).
      - name: Smoke test - workflow fleet-sprint --help (no system Node)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(pwd)/dist/${{ matrix.binary }}"
          FAKEHOME="$(mktemp -d)"
          export HOME="$FAKEHOME"
          export APRA_FLEET_DATA_DIR="$FAKEHOME/data"
          export PATH="/usr/bin:/bin"
          ! command -v node
          OUT="$("$BIN" workflow fleet-sprint --help 2>stderr.log)"
          ERR="$(cat stderr.log)"
          echo "$OUT"
          echo "--- stderr ---"
          echo "$ERR"
          echo "$OUT" | grep -qF 'Usage: fleet-se sprint [options]'
          echo "$OUT" | grep -qF -- '--role-map <json|@file>'
          ! echo "$ERR" | grep -qF '[contracts] Using the local apra-pm copy'
          ! echo "$ERR" | grep -qi 'cannot find module'
          ! echo "$ERR" | grep -qi 'ERR_MODULE_NOT_FOUND'
          test -f "$FAKEHOME/.apra-fleet/workflows/fleet-sprint/bin/cli.mjs"

      - name: Smoke test - workflow fleet-sprint --help (no system Node) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FAKEHOME = Join-Path $env:RUNNER_TEMP "fakehome-as-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $FAKEHOME -Force | Out-Null
          $env:HOME = $FAKEHOME
          $env:USERPROFILE = $FAKEHOME
          $env:APRA_FLEET_DATA_DIR = Join-Path $FAKEHOME "data"

          $filtered = ($env:PATH -split ';') | Where-Object { $_ -notmatch 'hostedtoolcache.*node' -and $_ -notmatch '[\\/]nodejs' }
          $env:PATH = ($filtered -join ';')
          if (Get-Command node -ErrorAction SilentlyContinue) {
            Write-Error "node is still resolvable on PATH after stripping"
            exit 1
          }

          $bin = Join-Path $PWD "dist\${{ matrix.binary }}"
          $out = & $bin workflow fleet-sprint --help 2>"$env:RUNNER_TEMP\as-stderr.log"
          $code = $LASTEXITCODE
          $errText = Get-Content "$env:RUNNER_TEMP\as-stderr.log" -Raw -ErrorAction SilentlyContinue
          $out | Write-Host
          Write-Host "--- stderr ---"
          Write-Host $errText
          if ($code -ne 0) {
            Write-Error "workflow fleet-sprint --help exited $code"
            exit 1
          }
          $outText = ($out -join [char]10)
          if (-not $outText.Contains('Usage: fleet-se sprint [options]')) {
            Write-Error "unexpected stdout from workflow fleet-sprint --help"
            exit 1
          }
          if (-not $outText.Contains('--role-map <json|@file>')) {
            Write-Error "unexpected stdout from workflow fleet-sprint --help (missing --role-map)"
            exit 1
          }
          if ($errText -and $errText.Contains('[contracts] Using the local apra-pm copy')) {
            Write-Error "schema dev-fallback warning present -- APRA_FLEET_SE_SCHEMAS_DIR did not resolve the installed schemas tree"
            exit 1
          }
          if ($errText -and ($errText -match '(?i)cannot find module|ERR_MODULE_NOT_FOUND')) {
            Write-Error "module-resolution error detected in stderr"
            exit 1
          }

          $cliPath = Join-Path $FAKEHOME ".apra-fleet\workflows\fleet-sprint\bin\cli.mjs"
          if (-not (Test-Path $cliPath)) {
            Write-Error "missing $cliPath"
            exit 1
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          retention-days: 30

  sign-windows:
    environment: signing
    needs: build-binary
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '_')
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: apra-fleet-installer-win-x64.exe
          path: to-sign

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign exe
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: to-sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload signed binary
        uses: actions/upload-artifact@v4
        with:
          name: apra-fleet-installer-win-x64.exe
          path: to-sign/apra-fleet-installer-win-x64.exe
          retention-days: 30
          overwrite: true

  release:
    needs: [package, build-binary, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '_')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf-8')).version)")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-6)
          FULL_VERSION="v${VERSION}_${SHORT_SHA}"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release tarball
        run: |
          TARBALL_NAME="apra-fleet-${{ steps.version.outputs.version }}.tar.gz"
          tar czf "$TARBALL_NAME" \
            dist/ \
            skills/ \
            hooks/ \
            install.sh \
            version.json \
            package.json \
            package-lock.json
          echo "TARBALL_NAME=$TARBALL_NAME" >> "$GITHUB_ENV"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          pattern: apra-fleet-*
          merge-multiple: true

      - name: Write the BUILD_INFO marker
        run: |
          # The exact build version the binaries report (apra-fleet --version):
          # member installs accept this stable release for an orchestrator build
          # only when it names that build (src/services/member-fleet-install.ts).
          cd release-binaries
          chmod +x apra-fleet-installer-linux-x64
          BUILD=$(./apra-fleet-installer-linux-x64 --version | head -n1 | awk '{print $2}')
          case "$BUILD" in v[0-9]*) ;; *) echo "::error::could not read the build version (got '$BUILD')"; exit 1 ;; esac
          printf 'version=%s\ncommit=%s\n' "$BUILD" "$GITHUB_SHA" > BUILD_INFO
          cat BUILD_INFO

      - name: Publish SHA-256 checksums for the binary assets
        run: |
          # Member installs download these assets and verify them against
          # SHA256SUMS before running them (src/services/member-fleet-install.ts).
          cd release-binaries
          sha256sum apra-fleet-installer-linux-x64 apra-fleet-installer-darwin-arm64 apra-fleet-installer-darwin-x64 apra-fleet-installer-win-x64.exe BUILD_INFO > SHA256SUMS
          cat SHA256SUMS

      - name: Read the previous stable release
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # releases/latest excludes prereleases and drafts, so the notes are
          # computed against the previous STABLE release, never a prerelease
          # tag of the same commit. Empty (first release) -> GitHub's default.
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous stable release: ${PREV:-(none)}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          previous_tag: ${{ steps.prev.outputs.tag }}
          files: |
            release-binaries/SHA256SUMS
            release-binaries/BUILD_INFO
            ${{ env.TARBALL_NAME }}
            release-binaries/apra-fleet-installer-linux-x64
            release-binaries/apra-fleet-installer-darwin-arm64
            release-binaries/apra-fleet-installer-darwin-x64
            release-binaries/apra-fleet-installer-win-x64.exe
          generate_release_notes: true

  # Unsigned prerelease of every build pushed to main / feat/kb-redesign, so a
  # member install of an unreleased orchestrator build has an anonymous
  # download source (Actions artifacts need auth and expire). Tag = the exact
  # build version the binaries report (e.g. v0.4.4_d1e339). Never signed (no
  # sign-windows dependency), never marked latest; older prereleases of the
  # same branch are pruned to the newest $KEEP. Stable v* tag releases are
  # untouched (release job above). Tags created with GITHUB_TOKEN trigger no
  # workflow; the tag-gated jobs also skip any tag containing '_'.
  #
  # Cancellation: the workflow-level concurrency group cancels this job when a
  # newer push lands (a job-level group cannot prevent that), so publishing is
  # made cancel-safe instead: the release is built as a DRAFT (invisible to
  # anonymous downloads) and flipped to published only after every asset is
  # uploaded. A cancelled run leaves at most a draft, which the next run of the
  # same build completes and the prune step deletes once it is stale. A
  # published prerelease is never re-uploaded (no non-atomic --clobber on a
  # release members may be downloading from).
  prerelease:
    needs: [package, build-binary]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/kb-redesign')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      KEEP: '3'
      # Drafts of this channel older than this are leftovers of cancelled runs.
      STALE_DRAFT_SECONDS: '86400'
    steps:
      - name: Download the unsigned binaries and the tarball
        uses: actions/download-artifact@v4
        with:
          path: prerelease
          pattern: apra-fleet-*
          merge-multiple: true

      # No token in this step's environment: it runs the built binary.
      - name: Read the build version from the linux binary
        id: version
        run: |
          cd prerelease
          chmod +x apra-fleet-installer-linux-x64
          TAG=$(./apra-fleet-installer-linux-x64 --version | head -n1 | awk '{print $2}')
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+_[0-9a-f]{6}$ ]]; then
            echo "::error::expected a build version v<x.y.z>_<6 hex>, got '$TAG'"; exit 1
          fi
          SUFFIX="${TAG#*_}"
          case "$GITHUB_SHA" in "$SUFFIX"*) ;; *) echo "::error::build suffix $SUFFIX is not a prefix of $GITHUB_SHA"; exit 1 ;; esac
          git check-ref-format "refs/tags/$TAG" || { echo "::error::git rejects the tag name $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Prerelease tag: $TAG"

      - name: Write BUILD_INFO and SHA256SUMS
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd prerelease
          printf 'version=%s\ncommit=%s\n' "$TAG" "$GITHUB_SHA" > BUILD_INFO
          sha256sum apra-fleet-installer-linux-x64 apra-fleet-installer-darwin-arm64 apra-fleet-installer-darwin-x64 apra-fleet-installer-win-x64.exe BUILD_INFO > SHA256SUMS
          cat BUILD_INFO SHA256SUMS
          ls -l

      - name: Publish the prerelease (draft, upload, then publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          MARKER="apra-fleet-prerelease-channel: $GITHUB_REF"
          cd prerelease
          FILES="apra-fleet-installer-linux-x64 apra-fleet-installer-darwin-arm64 apra-fleet-installer-darwin-x64 apra-fleet-installer-win-x64.exe SHA256SUMS BUILD_INFO"
          for t in apra-fleet-*.tar.gz; do if [ -f "$t" ]; then FILES="$FILES $t"; fi; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            STATE=$(gh release view "$TAG" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')
            case "$STATE" in
              "true false")
                # Already published by an earlier run of this commit (or the same
                # commit on the other branch). It was published only after all
                # its assets were uploaded, so it is complete: leave it as is.
                HAVE=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
                for f in apra-fleet-installer-linux-x64 apra-fleet-installer-darwin-arm64 apra-fleet-installer-darwin-x64 apra-fleet-installer-win-x64.exe SHA256SUMS BUILD_INFO; do
                  case " $HAVE " in *" $f "*) ;; *) echo "::error::published prerelease $TAG lacks $f; delete it (gh release delete $TAG --cleanup-tag) and re-run"; exit 1 ;; esac
                done
                echo "$TAG is already published and complete; not re-uploading"
                ;;
              "true true")
                # A draft left by a cancelled run: invisible to downloads, so
                # replacing its assets is safe; then publish it.
                gh release upload "$TAG" $FILES --clobber
                ;;
              *)
                echo "::error::release $TAG exists and is not a prerelease (state: $STATE); refusing to touch it"; exit 1
                ;;
            esac
          else
            NOTES=$(printf 'Unsigned prerelease build %s of %s (commit %s), for member installs of this exact orchestrator build. Not a supported release; the Windows installer is not code-signed. Verify downloads against SHA256SUMS.\n\n<!-- %s -->\n' "$TAG" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$MARKER")
            gh release create "$TAG" $FILES --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "$TAG (prerelease, $GITHUB_REF_NAME)" --notes "$NOTES"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
          FINAL=$(gh release view "$TAG" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')
          if [ "$FINAL" != "true false" ]; then echo "::error::$TAG is not a published prerelease (isPrerelease isDraft = $FINAL)"; exit 1; fi
          echo "Published prerelease $TAG"

      - name: Prune older prereleases and stale drafts of this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="apra-fleet-prerelease-channel: $GITHUB_REF"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > releases.json.pages
          # --paginate concatenates one JSON array per page.
          jq -s 'add' releases.json.pages > releases.json
          # Published prereleases this job made for this branch (marker in the
          # body): newest first, keep the newest $KEEP, delete the rest + tags.
          jq -r --arg m "$MARKER" '.[] | select(.prerelease == true and .draft == false) | select((.body // "") | contains($m)) | [.created_at, .tag_name] | @tsv' releases.json \
            | sort -r | awk -F'\t' -v keep="$KEEP" 'NR > keep {print $2}' > prune.txt
          echo "Pruning $(wc -l < prune.txt) prerelease(s):"; cat prune.txt
          while read -r OLD; do
            if [ -z "$OLD" ]; then continue; fi
            if [ "$(gh release view "$OLD" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')" != "true false" ]; then echo "skip $OLD: not a published prerelease"; continue; fi
            gh release delete "$OLD" --cleanup-tag --yes
          done < prune.txt
          # Stale drafts of this channel (cancelled runs): deleted by release id
          # (a draft has no tag yet). Recent drafts may belong to a running job.
          jq -r --arg m "$MARKER" --argjson age "$STALE_DRAFT_SECONDS" '.[] | select(.draft == true) | select((.body // "") | contains($m)) | select((.created_at | fromdateiso8601) < (now - $age)) | "\(.id) \(.tag_name)"' releases.json > drafts.txt
          echo "Deleting $(wc -l < drafts.txt) stale draft(s):"; cat drafts.txt
          while read -r ID NAME; do
            if [ -z "$ID" ]; then continue; fi
            gh api -X DELETE "repos/$GH_REPO/releases/$ID"
          done < drafts.txt

  npm-publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '_')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Inject version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf-8'));
            const ver = JSON.parse(fs.readFileSync('version.json','utf-8'));
            pkg.version = '${TAG}';
            ver.version = '${TAG}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            fs.writeFileSync('version.json', JSON.stringify(ver, null, 2) + '\n');
          "
          echo "Injected version: ${TAG}"

      - name: Version lockstep guard
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf-8')).version)")
          VER_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf-8')).version)")
          echo "Tag=$TAG  package.json=$PKG_VER  version.json=$VER_VER"
          if [ "$TAG" != "$PKG_VER" ] || [ "$TAG" != "$VER_VER" ]; then
            echo "::error::Version mismatch! tag=$TAG package.json=$PKG_VER version.json=$VER_VER"
            exit 1
          fi

      - name: Build
        # Explicit prepublishOnly: npm only fires it on `npm publish`, not
        # `npm pack`, and the dry-run pack check below needs the same
        # artifacts a real publish would produce.
        run: npm run prepublishOnly

      - name: Verify shebang
        run: |
          head -1 dist/index.js | grep -q '^#!/usr/bin/env node'
          head -1 packages/apra-fleet-se/bin/cli.mjs | grep -q '^#!/usr/bin/env node'

      - name: Dry-run pack verification
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          grep -q 'dist/index.js' pack-output.txt
          grep -q 'version.json' pack-output.txt
          grep -q 'hooks/hooks-config.json' pack-output.txt
          grep -q 'skills/pm/' pack-output.txt || grep -q 'skills/fleet/' pack-output.txt
          grep -q 'packages/apra-fleet-se/bin/cli.mjs' pack-output.txt
          grep -q 'packages/apra-fleet-se/fleet-sprint/runner.js' pack-output.txt
          grep -q 'packages/apra-fleet-se/workflow.json' pack-output.txt
          grep -q 'dist/agents/schemas/' pack-output.txt
          echo "Pack verification passed"

      - name: Clean-pack guard -- reject stale SEA build artifacts
        run: |
          npm pack --dry-run 2>&1 | tee pack-check.txt
          if grep -qE '\.(exe)$|sea-prep\.blob|sea-bundle\.cjs' pack-check.txt; then
            echo "::error::Pack contains stale SEA build artifacts (exe/sea-prep.blob/sea-bundle.cjs). Clean dist/ and retry."
            grep -E '\.(exe)$|sea-prep\.blob|sea-bundle\.cjs' pack-check.txt
            exit 1
          fi
          node scripts/check-pack-size.mjs
          echo "Clean-pack guard passed"

      - name: Pack + install into a clean temp prefix (fleet-sprint smoke test)
        # Proves a real packed tarball, installed into a fresh non-monorepo
        # prefix, gives `apra-fleet workflow fleet-sprint --help` a working
        # entry point resolving schemas from the co-packaged
        # dist/agents/schemas/ (not the monorepo dev-fallback, which warns).
        # Requires the explicit `apra-fleet install` step first: cli.mjs's
        # bare-specifier imports only land on disk via that extraction step,
        # not via plain `npm install`.
        run: |
          TMP_INSTALL=$(mktemp -d)
          npm pack --pack-destination "$TMP_INSTALL"
          TARBALL=$(ls "$TMP_INSTALL"/apralabs-apra-fleet-*.tgz)

          INSTALL_PREFIX=$(mktemp -d)
          npm install --prefix "$INSTALL_PREFIX" "$TARBALL" --no-save --no-audit --no-fund
          PKG_DIR="$INSTALL_PREFIX/node_modules/@apralabs/apra-fleet"
          BIN="$INSTALL_PREFIX/node_modules/.bin/apra-fleet"

          test -d "$PKG_DIR/dist/agents/schemas" || { echo "::error::dist/agents/schemas/ missing from the packed tarball."; exit 1; }
          SCHEMA_COUNT=$(ls "$PKG_DIR/dist/agents/schemas/"*.json 2>/dev/null | wc -l)
          if [ "$SCHEMA_COUNT" -eq 0 ]; then
            echo "::error::dist/agents/schemas/ is present but contains no *.json files."
            exit 1
          fi

          FAKEHOME=$(mktemp -d)
          export HOME="$FAKEHOME"
          export USERPROFILE="$FAKEHOME"
          export APRA_FLEET_DATA_DIR="$FAKEHOME/data"

          "$BIN" install --skill none --workflows all --transport stdio

          "$BIN" workflow fleet-sprint --help > "$TMP_INSTALL/se-help-stdout.txt" 2> "$TMP_INSTALL/se-help-stderr.txt"
          grep -q 'Usage: fleet-se sprint' "$TMP_INSTALL/se-help-stdout.txt" || {
            echo "::error::fleet-sprint --help did not produce the expected usage text."
            cat "$TMP_INSTALL/se-help-stdout.txt"
            exit 1
          }
          if grep -q 'Using the local apra-pm copy' "$TMP_INSTALL/se-help-stderr.txt"; then
            echo "::error::apra-fleet workflow fleet-sprint fell back to the local apra-pm dev path instead of resolving the packaged dist/agents/schemas/ -- the tarball's schema bundling is broken."
            cat "$TMP_INSTALL/se-help-stderr.txt"
            exit 1
          fi
          echo "Clean install smoke test passed: apra-fleet workflow fleet-sprint --help works via a real npm install + apra-fleet install, schemas resolved from dist/agents/schemas (no dev-fallback warning)"

      - name: Check if version already published
        id: check-published
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if npm view @apralabs/apra-fleet@${TAG} version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Version ${TAG} is already published to npm -- skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check-published.outputs.already_published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
