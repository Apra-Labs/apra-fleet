<svg width="1080" height="680" viewBox="0 0 1080 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apra-fleet topology: heterogeneous devices connected to a central control plane.">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="topBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="cardBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGoldFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyanFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridTopDark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1080" height="680" fill="url(#topBgDark)"/>
  <rect width="1080" height="680" fill="url(#gridTopDark)"/>

  <!-- TOP HEADER BLOCK -->
  <!-- Category Pill Badge moved to TOP LEFT (x=50, y=32) -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#FBBF24" filter="url(#glowGoldFilter)"/>
    <text x="30" y="13" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5" fill="#FBBF24">FLEET TOPOLOGY</text>
  </g>

  <!-- Centered Headline Title at y=84 -->
  <text x="540" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="900" fill="#F8FAFC" text-anchor="middle">Heterogeneous Device &amp; Provider Control Plane</text>

  <!-- Centered Subtitle at y=112 -->
  <text x="540" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">A unified control plane orchestrating AI agents across your local laptops, cloud VMs, GPUs, and edge nodes.</text>

  <!-- TOPOLOGY CONSTELLATION GRAPH (Center at x=540, y=355) -->
  <g transform="translate(540, 355)">

    <!-- Orbit Ring & Spoke Lines to 6 Nodes -->
    <g fill="none" stroke-width="1.5">
      <circle cx="0" cy="0" r="220" stroke="#334155" stroke-dasharray="4 6" opacity="0.6"/>

      <!-- Spokes -->
      <path d="M 0 0 L -290 -145" stroke="#F59E0B" stroke-dasharray="4 4"/>
      <path d="M 0 0 L 290 -145" stroke="#06B6D4" stroke-dasharray="4 4"/>
      <path d="M 0 0 L 310 30" stroke="#10B981" stroke-dasharray="4 4"/>
      <path d="M 0 0 L 200 180" stroke="#F59E0B" stroke-dasharray="4 4"/>
      <path d="M 0 0 L -290 170" stroke="#8B5CF6" stroke-dasharray="4 4"/>
      <path d="M 0 0 L -310 20" stroke="#64748B" stroke-dasharray="4 4"/>
    </g>

    <!-- Security Protocol Badges along Spokes -->
    <g transform="translate(-145, -72)">
      <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
      <text x="0" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="middle">SSE / TLS</text>
    </g>

    <g transform="translate(145, -72)">
      <rect x="-40" y="-11" width="80" height="22" rx="11" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
      <text x="0" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">SSH Tunnel</text>
    </g>

    <g transform="translate(-145, 85)">
      <rect x="-44" y="-11" width="88" height="22" rx="11" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
      <text x="0" y="0" dominant-baseline="central" font-family="monospace" font-size="9" font-weight="700" fill="#A78BFA" text-anchor="middle">{{secure.KEY}}</text>
    </g>

    <g transform="translate(155, 15)">
      <rect x="-28" y="-11" width="56" height="22" rx="11" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      <text x="0" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">mTLS</text>
    </g>

    <!-- CENTER CONTROL PLANE HUB (Label ABOVE Hexagon) -->
    <text x="0" y="-62" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="#FBBF24" text-anchor="middle">CONTROL PLANE</text>

    <g filter="url(#glowGoldFilter)">
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -46,-24" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
      <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#F59E0B" fill-opacity="0.15" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="4 2"/>
    </g>

    <!-- Core Play Icon -->
    <circle cx="0" cy="0" r="15" fill="#F59E0B"/>
    <polygon points="-5,-6 6,0 -5,6" fill="#080C14"/>
    <text x="0" y="62" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">Supervisor • Ledger • MCP</text>


    <!-- SLEEK COMPACT MEMBER CARDS -->

    <!-- NODE 1: MacBook Pro (Top-Left: -290, -145) -->
    <g transform="translate(-290, -145)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="url(#cardBgDark)" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#1E293B"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#1E293B"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#F59E0B"/>
      <circle cx="-55" cy="-28" r="3" fill="#10B981"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">MacBook Pro (macOS)</text>

      <rect x="-75" y="-10" width="60" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
      <text x="-45" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#FBBF24" text-anchor="middle">Claude</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Role: Lead Developer</text>
    </g>

    <!-- NODE 2: Cloud VM (Top-Right: 290, -145) -->
    <g transform="translate(290, -145)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="url(#cardBgDark)" stroke="#06B6D4" stroke-width="1.5"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#1E293B"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#1E293B"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#F59E0B"/>
      <circle cx="-55" cy="-28" r="3" fill="#10B981"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">Cloud VM (AWS EC2)</text>

      <rect x="-75" y="-10" width="92" height="18" rx="4" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
      <text x="-29" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle">Gemini / Codex</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Role: Parallel Refactor</text>
    </g>

    <!-- NODE 3: GPU Supercomputer (Middle-Right: 310, 30) -->
    <g transform="translate(310, 30)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="url(#cardBgDark)" stroke="#10B981" stroke-width="1.5"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#1E293B"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#1E293B"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#F59E0B"/>
      <circle cx="-55" cy="-28" r="3" fill="#10B981"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">Linux GPU (Lab Box)</text>

      <rect x="-75" y="-10" width="112" height="18" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
      <text x="-19" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#34D399" text-anchor="middle">Local vLLM / Llama3</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Role: Private Data Ops</text>
    </g>

    <!-- NODE 4: CI Test Rack (Bottom-Right: 200, 180) -->
    <g transform="translate(200, 180)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="url(#cardBgDark)" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#1E293B"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#1E293B"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#F59E0B"/>
      <circle cx="-55" cy="-28" r="3" fill="#10B981"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">CI Test Rack (Linux)</text>

      <rect x="-75" y="-10" width="118" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
      <text x="-16" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#FBBF24" text-anchor="middle">81 Test Integration Suites</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Role: Quality Verification</text>
    </g>

    <!-- NODE 5: Windows Workstation (Bottom-Left: -290, 170) -->
    <g transform="translate(-290, 170)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="url(#cardBgDark)" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#1E293B"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#1E293B"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#F59E0B"/>
      <circle cx="-55" cy="-28" r="3" fill="#10B981"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#F8FAFC">Windows Workstation (Win 11)</text>

      <rect x="-75" y="-10" width="72" height="18" rx="4" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
      <text x="-39" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#A78BFA" text-anchor="middle">Antigravity</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Role: Cross Reviewer</text>
    </g>

    <!-- NODE 6: Jetson / Raspi (Middle-Left: -310, 20) -->
    <g transform="translate(-310, 20)">
      <rect x="-85" y="-40" width="170" height="80" rx="8" fill="url(#cardBgDark)" stroke="#64748B" stroke-width="1.5"/>
      <rect x="-85" y="-40" width="170" height="24" rx="8" fill="#1E293B"/>
      <rect x="-85" y="-24" width="170" height="8" fill="#1E293B"/>
      <circle cx="-73" cy="-28" r="3" fill="#EF4444"/>
      <circle cx="-64" cy="-28" r="3" fill="#F59E0B"/>
      <circle cx="-55" cy="-28" r="3" fill="#10B981"/>
      <text x="-46" y="-28" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">Jetson / Raspi (ARM64)</text>

      <rect x="-75" y="-10" width="52" height="18" rx="4" fill="#334155" opacity="0.6" stroke="#64748B" stroke-width="1"/>
      <text x="-49" y="-1" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#CBD5E1" text-anchor="middle">NoLLM</text>

      <text x="-75" y="20" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Role: Edge Worker</text>
    </g>

  </g>

  <!-- BOTTOM FOOTER TAGLINE -->
  <text x="540" y="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.5" fill="#64748B" text-anchor="middle">ONE CONTROL PLANE. ANY DEVICE. ANY MODEL. ANY WORKFLOW. ANY DOMAIN.</text>
</svg>
