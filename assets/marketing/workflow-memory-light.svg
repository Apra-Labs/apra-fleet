<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow memory &amp; resumability in apra-fleet: stateless prompt chains vs durable workflows.">
  <defs>
    <!-- Background Gradient Light -->
    <linearGradient id="memBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowLightCard" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <!-- Cyber Grid Pattern Light -->
    <pattern id="gridMemLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.8"/>
      <circle cx="40" cy="40" r="1.5" fill="#CBD5E1" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="660" fill="url(#memBgLight)"/>
  <rect width="1280" height="660" fill="url(#gridMemLight)"/>

  <!-- TOP HEADER BLOCK -->
  <!-- Category Pill Badge -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#D97706"/>
    <text x="30" y="14" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1.0" fill="#B45309">WORKFLOW MEMORY &amp; RESUMABILITY</text>
  </g>

  <!-- Main Title at y=105 -->
  <text x="50" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="900" fill="#0F172A">Durable Workflows: Append-Only Journal &amp; Zero-Token Replay</text>

  <!-- Subtitle at y=138 -->
  <text x="50" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Stateful orchestration in apra-fleet: never lose progress, tokens, or time on network drops or process crashes.</text>

  <!-- MAIN COMPARISON LANES (y=170) -->

  <!-- LANE A: STATELESS PROMPT CHAINS (y=170, height=200) -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="1180" height="200" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadowLightCard)"/>

    <!-- Panel Header Bar -->
    <rect x="0" y="0" width="1180" height="38" rx="14" fill="#F8FAFC"/>
    <rect x="0" y="24" width="1180" height="14" fill="#F8FAFC"/>
    <line x1="0" y1="38" x2="1180" y2="38" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#EF4444"/>
    <text x="38" y="19" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F172A">LANE A: STATELESS PROMPT CHAINS (Standard Frameworks)</text>
    <!-- Right Badge Anchored to x=1150 (Zero Bleed!) -->
    <text x="1150" y="19" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="end">[FAIL] Wasted Tokens &amp; Time</text>

    <!-- Lane A Step Flow -->
    <g transform="translate(40, 52)">
      <!-- Connecting Line -->
      <line x1="55" y1="27" x2="800" y2="27" stroke="#E2E8F0" stroke-width="2"/>

      <!-- Step 1: Plan -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="115" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="57.5" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">1. Plan</text>
        <text x="57.5" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">35k tokens</text>
      </g>

      <!-- Step 2: Code -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="115" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="57.5" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">2. Code</text>
        <text x="57.5" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">50k tokens</text>
      </g>

      <!-- Step 3: Review -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="115" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="57.5" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">3. Review</text>
        <text x="57.5" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">40k tokens</text>
      </g>

      <!-- Step 4: Test -->
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="115" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="57.5" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">4. Test</text>
        <text x="57.5" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">25k tokens</text>
      </g>

      <!-- Step 5: CRASH Node -->
      <g transform="translate(720, -5)">
        <rect x="0" y="0" width="140" height="64" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
        <text x="70" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="900" fill="#991B1B" text-anchor="middle">CRASH!</text>
        <text x="70" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#7F1D1D" text-anchor="middle">API Drop / Timeout</text>
        <text x="70" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="600" fill="#991B1B" text-anchor="middle">No Checkpoint</text>
      </g>

      <!-- Bold Red Restart Curve Arrow -->
      <path d="M 790 65 C 600 125, 230 125, 57.5 65" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="57.5,65 67,70 67,60" fill="#DC2626"/>

      <!-- High-Impact Loss Label -->
      <rect x="270" y="108" width="370" height="22" rx="11" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
      <text x="455" y="119" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="900" fill="#991B1B" text-anchor="middle">FORCED COLD RESTART FROM STEP 1 (All 150k Tokens Lost)</text>
    </g>
  </g>

  <!-- LANE B: APRA-FLEET DURABLE WORKFLOW (y=395, height=215) -->
  <g transform="translate(50, 395)">
    <rect x="0" y="0" width="1180" height="215" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#shadowLightCard)"/>

    <!-- Panel Header Bar -->
    <rect x="0" y="0" width="1180" height="38" rx="14" fill="#F8FAFC"/>
    <rect x="0" y="24" width="1180" height="14" fill="#F8FAFC"/>
    <line x1="0" y1="38" x2="1180" y2="38" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#059669"/>
    <text x="38" y="19" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F172A">LANE B: APRA-FLEET DURABLE WORKFLOW (Atomic journal.jsonl)</text>
    <text x="475" y="19" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#047857">REPLAYED FREE FROM journal.jsonl (0 TOKENS / $0.00 COST)</text>

    <!-- Right Badge Anchored to x=1150 (Zero Bleed!) -->
    <text x="1150" y="19" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#047857" text-anchor="end">[SUCCESS] Zero-Token Replay</text>

    <!-- Lane B Step Flow -->
    <g transform="translate(30, 48)">

      <!-- Dotted Replay Zone Bounding Box -->
      <rect x="0" y="-4" width="550" height="88" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="275" y="-12" dominant-baseline="central" font-family="monospace" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">journal.jsonl Instant Replay Zone (0 Tokens)</text>

      <!-- Connecting Line -->
      <line x1="50" y1="38" x2="870" y2="38" stroke="#059669" stroke-width="2"/>

      <!-- Step 1: Plan (Replayed) -->
      <g transform="translate(15, 10)">
        <rect x="0" y="0" width="110" height="56" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.5"/>
        <text x="55" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">1. Plan</text>
        <text x="55" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">[REPLAYED]</text>
      </g>

      <!-- Step 2: Code (Replayed) -->
      <g transform="translate(145, 10)">
        <rect x="0" y="0" width="110" height="56" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.5"/>
        <text x="55" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">2. Code</text>
        <text x="55" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">[REPLAYED]</text>
      </g>

      <!-- Step 3: Review (Replayed) -->
      <g transform="translate(275, 10)">
        <rect x="0" y="0" width="110" height="56" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.5"/>
        <text x="55" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">3. Review</text>
        <text x="55" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">[REPLAYED]</text>
      </g>

      <!-- Step 4: Test (Replayed) -->
      <g transform="translate(405, 10)">
        <rect x="0" y="0" width="110" height="56" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.5"/>
        <text x="55" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">4. Test</text>
        <text x="55" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">[REPLAYED]</text>
      </g>

      <!-- Step 5: Deploy (Resumed Live!) -->
      <g transform="translate(580, 10)">
        <rect x="0" y="0" width="120" height="56" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="60" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="900" fill="#B45309" text-anchor="middle">5. Deploy</text>
        <text x="60" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#B45309" text-anchor="middle">Resumed Live!</text>
      </g>

      <!-- Step 6: Harvest (Passed) -->
      <g transform="translate(725, 10)">
        <rect x="0" y="0" width="110" height="56" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.5"/>
        <text x="55" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">6. Harvest</text>
        <text x="55" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">[PASSED]</text>
      </g>

      <!-- Final COMPLETED Badge Box -->
      <g transform="translate(865, 3)">
        <rect x="0" y="0" width="155" height="70" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
        <text x="77.5" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">COMPLETED</text>
        <text x="77.5" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">100% Work Saved</text>
      </g>

      <!-- Bottom Watchdog Description Line -->
      <g transform="translate(15, 112)">
        <circle cx="0" cy="0" r="4.5" fill="#059669"/>
        <text x="16" y="0" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14">
          <tspan font-weight="900" fill="#0F172A">apra-fleet Supervisor Watchdog:</tspan>
          <tspan dx="10" font-weight="500" fill="#475569">Detects dead processes and replays completed journal steps instantly.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
