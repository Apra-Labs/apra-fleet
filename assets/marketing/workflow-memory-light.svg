<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apra-fleet-workflow resumable runs: every agent and command call is written to an append-only execution journal. When a run crashes, resuming replays every already-completed step directly from the journal with zero re-dispatch -- no LLM call, no cost, no shell re-run -- and runs live only from the real failure point. A stateless session with no journal restarts cold from step one, re-dispatching and re-billing everything.">
  <rect width="1280" height="660" fill="#ffffff"/>

  <!-- subtle grid (same 80px rhythm as hero banner) -->
  <g stroke="#eef1f4" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="660"/><line x1="120" y1="0" x2="120" y2="660"/>
    <line x1="200" y1="0" x2="200" y2="660"/><line x1="280" y1="0" x2="280" y2="660"/>
    <line x1="360" y1="0" x2="360" y2="660"/><line x1="440" y1="0" x2="440" y2="660"/>
    <line x1="520" y1="0" x2="520" y2="660"/><line x1="600" y1="0" x2="600" y2="660"/>
    <line x1="680" y1="0" x2="680" y2="660"/><line x1="760" y1="0" x2="760" y2="660"/>
    <line x1="840" y1="0" x2="840" y2="660"/><line x1="920" y1="0" x2="920" y2="660"/>
    <line x1="1000" y1="0" x2="1000" y2="660"/><line x1="1080" y1="0" x2="1080" y2="660"/>
    <line x1="1160" y1="0" x2="1160" y2="660"/><line x1="1240" y1="0" x2="1240" y2="660"/>
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="440" x2="1280" y2="440"/>
    <line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <defs>
    <radialGradient id="journalGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c97a1e" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#c97a1e" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#c97a1e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow spotlighting the journal / replay cluster (the "memory") -->
  <circle cx="207" cy="290" r="240" fill="url(#journalGlowL)"/>

  <!-- title block (mirrors hero wordmark treatment) -->
  <text x="48" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#c97a1e">DETERMINISTIC WORKFLOWS + MEMORY</text>
  <text x="46" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1c2128">A crash loses time -- not work or money.</text>
  <text x="48" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Every agent() and command() call lands in an append-only journal. Resume replays finished steps free, then runs live from the crash point.</text>

  <!-- ============ ROW A: with journal (resumed run) ============ -->
  <text x="70" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2128">Resume from journal<tspan fill="#57606a" font-weight="400" font-size="13">   -- memory on</tspan></text>

  <!-- replay spine (fast / ghosted) -->
  <line x1="96" y1="250" x2="338" y2="250" stroke="#c97a1e" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.5"/>

  <!-- replay band behind the completed steps -->
  <rect x="96" y="224" width="222" height="52" rx="12" fill="#c97a1e" fill-opacity="0.07" stroke="#c97a1e" stroke-width="1.25" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- 4 completed+journaled steps: check only, ghosted -->
  <g>
    <rect x="113" y="233" width="34" height="34" rx="8" fill="#c97a1e" fill-opacity="0.06" stroke="#57606a" stroke-width="1.5"/>
    <path d="M 122 250 l 5 6 l 10 -13" fill="none" stroke="#c97a1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="163" y="233" width="34" height="34" rx="8" fill="#c97a1e" fill-opacity="0.06" stroke="#57606a" stroke-width="1.5"/>
    <path d="M 172 250 l 5 6 l 10 -13" fill="none" stroke="#c97a1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="213" y="233" width="34" height="34" rx="8" fill="#c97a1e" fill-opacity="0.06" stroke="#57606a" stroke-width="1.5"/>
    <path d="M 222 250 l 5 6 l 10 -13" fill="none" stroke="#c97a1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="263" y="233" width="34" height="34" rx="8" fill="#c97a1e" fill-opacity="0.06" stroke="#57606a" stroke-width="1.5"/>
    <path d="M 272 250 l 5 6 l 10 -13" fill="none" stroke="#c97a1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- replay pill above -->
  <rect x="104" y="183" width="210" height="25" rx="12.5" fill="#c97a1e" fill-opacity="0.1" stroke="#c97a1e" stroke-width="1.25"/>
  <text x="209" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c97a1e" text-anchor="middle">no re-dispatch - no re-bill - no re-run</text>
  <line x1="209" y1="208" x2="209" y2="222" stroke="#c97a1e" stroke-width="1.25"/>
  <circle cx="209" cy="223" r="2.25" fill="#c97a1e"/>

  <!-- connector label between band and journal card -->
  <text x="207" y="293" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">replay key match -> returned from journal</text>

  <!-- journal card (the memory) -->
  <rect x="96" y="300" width="222" height="76" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1" opacity="0.95"/>
  <circle cx="108" cy="315" r="3" fill="#c97a1e"/>
  <text x="118" y="319" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1c2128">journal.jsonl</text>
  <text x="220" y="319" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a">append-only</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a">
    <path d="M 108 334 l 3 3.5 l 6 -8" fill="none" stroke="#c97a1e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="337">seq 1 - agent - completed</text>
    <path d="M 108 348 l 3 3.5 l 6 -8" fill="none" stroke="#c97a1e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="351">seq 2 - command - completed</text>
    <path d="M 108 362 l 3 3.5 l 6 -8" fill="none" stroke="#c97a1e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="365">seq 3 - agent - completed</text>
  </g>

  <!-- crash break in the spine -->
  <polyline points="338,250 348,236 358,264 368,236 378,264 388,250" fill="none" stroke="#c97a1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- warning glyph -->
  <path d="M 362 202 L 377 229 L 347 229 Z" fill="#c97a1e" fill-opacity="0.14" stroke="#c97a1e" stroke-width="2" stroke-linejoin="round"/>
  <text x="362" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c97a1e" text-anchor="middle">!</text>
  <text x="362" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c2128" text-anchor="middle">CRASH</text>
  <text x="362" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">step 5 in-flight</text>

  <!-- live spine (real execution resumes) -->
  <line x1="392" y1="250" x2="883" y2="250" stroke="#1c2128" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#c97a1e">
    <circle cx="430" cy="250" r="3"/>
    <circle cx="545" cy="250" r="3"/>
    <circle cx="690" cy="250" r="3"/>
    <circle cx="850" cy="250" r="3"/>
  </g>

  <!-- live step 5 (resume point) -->
  <circle cx="470" cy="250" r="34" fill="none" stroke="#c97a1e" stroke-width="1.25" opacity="0.4"/>
  <rect x="443" y="223" width="54" height="54" rx="10" fill="#c97a1e" fill-opacity="0.1" stroke="#c97a1e" stroke-width="3"/>
  <text x="470" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c2128" text-anchor="middle">5</text>
  <!-- live step 6 -->
  <rect x="593" y="223" width="54" height="54" rx="10" fill="none" stroke="#1c2128" stroke-width="2.5"/>
  <circle cx="641" cy="229" r="4" fill="#c97a1e"/>
  <text x="620" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c2128" text-anchor="middle">6</text>
  <!-- live step 7 -->
  <rect x="743" y="223" width="54" height="54" rx="10" fill="none" stroke="#1c2128" stroke-width="2.5"/>
  <circle cx="791" cy="229" r="4" fill="#c97a1e"/>
  <text x="770" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c2128" text-anchor="middle">7</text>

  <!-- done terminal -->
  <circle cx="910" cy="250" r="27" fill="#c97a1e"/>
  <path d="M 898 250 l 8 9 l 16 -19" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="910" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c2128" text-anchor="middle">done</text>

  <!-- step 5 pill -->
  <rect x="386" y="183" width="168" height="25" rx="12.5" fill="#c97a1e" fill-opacity="0.1" stroke="#c97a1e" stroke-width="1.25"/>
  <text x="470" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c97a1e" text-anchor="middle">resumes live at the crash</text>
  <line x1="470" y1="208" x2="470" y2="221" stroke="#c97a1e" stroke-width="1.25"/>
  <circle cx="470" cy="222" r="2.25" fill="#c97a1e"/>

  <!-- lost:nothing pill -->
  <rect x="628" y="183" width="150" height="25" rx="12.5" fill="#c97a1e" fill-opacity="0.1" stroke="#c97a1e" stroke-width="1.25"/>
  <text x="703" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c97a1e" text-anchor="middle">lost: nothing</text>
  <line x1="703" y1="208" x2="703" y2="242" stroke="#c97a1e" stroke-width="1.25"/>
  <circle cx="703" cy="243" r="2.25" fill="#c97a1e"/>

  <!-- budget note by done -->
  <text x="962" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a"><tspan font-weight="700" fill="#1c2128">budget re-debits journaled cost</tspan></text>
  <text x="962" y="261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">so the resumed total = the whole logical run,</text>
  <text x="962" y="277" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">not just the live continuation.</text>

  <!-- ============ divider ============ -->
  <line x1="48" y1="405" x2="1232" y2="405" stroke="#57606a" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>

  <!-- ============ ROW B: no journal (stateless) ============ -->
  <text x="70" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2128">Stateless session<tspan fill="#57606a" font-weight="400" font-size="13">   -- no memory</tspan></text>
  <text x="70" y="459" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">a crash restarts cold from step 1</text>

  <!-- band behind the doomed steps -->
  <rect x="96" y="504" width="222" height="52" rx="12" fill="#57606a" fill-opacity="0.05" stroke="#57606a" stroke-width="1.25" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- "all work lost" pill -->
  <rect x="112" y="478" width="190" height="24" rx="12" fill="#57606a" fill-opacity="0.06" stroke="#57606a" stroke-width="1.25"/>
  <text x="207" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">all work lost on crash</text>
  <line x1="207" y1="502" x2="207" y2="504" stroke="#57606a" stroke-width="1.25"/>

  <!-- steps 1-4 that ran + billed, now wasted -->
  <line x1="96" y1="530" x2="338" y2="530" stroke="#57606a" stroke-width="2" stroke-linecap="round"/>
  <g>
    <rect x="113" y="513" width="34" height="34" rx="8" fill="none" stroke="#57606a" stroke-width="1.75"/>
    <text x="130" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">1</text>
    <rect x="163" y="513" width="34" height="34" rx="8" fill="none" stroke="#57606a" stroke-width="1.75"/>
    <text x="180" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">2</text>
    <rect x="213" y="513" width="34" height="34" rx="8" fill="none" stroke="#57606a" stroke-width="1.75"/>
    <text x="230" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">3</text>
    <rect x="263" y="513" width="34" height="34" rx="8" fill="none" stroke="#57606a" stroke-width="1.75"/>
    <text x="280" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">4</text>
  </g>

  <!-- crash in stateless row -->
  <polyline points="338,530 348,516 358,544 368,516 378,544 388,530" fill="none" stroke="#57606a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 362 484 L 376 509 L 348 509 Z" fill="#57606a" fill-opacity="0.12" stroke="#57606a" stroke-width="1.75" stroke-linejoin="round"/>
  <text x="362" y="507" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#57606a" text-anchor="middle">!</text>

  <!-- cold-restart loop-back arrow -->
  <path d="M 372 540 C 386 582 232 584 116 560" fill="none" stroke="#57606a" stroke-width="1.75" stroke-dasharray="4 4"/>
  <polygon points="116,560 128,554 127,566" fill="#57606a"/>
  <text x="250" y="606" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">cold restart -- steps 1-4 re-dispatched and re-billed, run resumes from step 1</text>

  <!-- ============ mini-ledger (right of stateless row) ============ -->
  <rect x="560" y="470" width="650" height="112" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1" opacity="0.9"/>
  <text x="580" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#c97a1e">ON CRASH -- WHAT IT COSTS YOU</text>
  <line x1="700" y1="504" x2="700" y2="572" stroke="#57606a" stroke-width="1" opacity="0.3"/>
  <line x1="576" y1="536" x2="1194" y2="536" stroke="#57606a" stroke-width="1" opacity="0.3"/>
  <!-- column headers -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#57606a" text-anchor="middle">
    <text x="790" y="524">TIME</text>
    <text x="960" y="524">WORK</text>
    <text x="1120" y="524">SPEND</text>
  </g>
  <!-- row: with journal -->
  <text x="580" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c97a1e">with journal</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="790" y="558" fill="#57606a">lost</text>
    <text x="960" y="558" fill="#c97a1e">kept</text>
    <text x="1120" y="558" fill="#c97a1e">kept</text>
  </g>
  <!-- row: no journal -->
  <text x="580" y="576" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#57606a">no journal</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle">
    <text x="790" y="576">lost</text>
    <text x="960" y="576">lost</text>
    <text x="1120" y="576">re-paid</text>
  </g>

  <!-- bottom caption -->
  <text x="640" y="636" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">On resume, a replay-key match returns each finished step straight from the journal -- zero re-dispatch. A crash costs you time, not work or money.</text>
</svg>
